# Production Profile — PostgreSQL on Render
# Activated by default in Dockerfile via -Dspring.profiles.active=prod

# Accepts SPRING_DATASOURCE_URL directly, or prefixes jdbc: onto Render's DATABASE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:${DATABASE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
