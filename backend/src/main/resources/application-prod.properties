# Production Profile — PostgreSQL on Render
# Activated via SPRING_PROFILES_ACTIVE=prod

# Render provides DATABASE_URL starting with postgresql:// or postgres://
# Java JDBC driver requires jdbc: prefix, so we prefix jdbc: here.
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
