# Production Profile — PostgreSQL on Render
# Activated by default in Dockerfile via -Dspring.profiles.active=prod

# DataSource bean is programmatically created in DatabaseConfig.java

# Force PostgreSQL dialect so Hibernate generates PostgreSQL-compatible DDL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DDL: update will create/alter tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Suppress the createClob() not implemented warning from PostgreSQL JDBC driver
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
