# Production Profile — PostgreSQL on Render
# Activated by default in Dockerfile via -Dspring.profiles.active=prod

# DataSource bean is programmatically created in DatabaseConfig.java

# PostgreSQL Dialect is auto-detected by Hibernate 6

# DDL: update will create/alter tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Open-In-View to prevent performance warnings and unclosed DB sessions
spring.jpa.open-in-view=false

# Suppress the createClob() not implemented warning from PostgreSQL JDBC driver
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
